syntax = "proto3";

package soroban_tx_resources;

option go_package = "github.com/withObsrvr/nebu-processor-registry/processors/soroban-tx-resources";

// SorobanTxResources carries the per-transaction facts that no other nebu
// origin emits: the declared Soroban resource footprint including ledger ENTRY
// counts, the decoded transaction and contract result codes, the fee actually
// charged against the fee bid, and the serialized envelope size.
//
// These are the inputs a ledger-capacity view needs. Utilisation is
// deliberately not computed here: the caps live in ConfigSettingEntry and
// change by protocol upgrade, so dividing by them is a downstream join, not a
// fact about this transaction.
//
// One event is emitted per transaction in the ledger's transaction set,
// including failed transactions, in apply order.
message SorobanTxResources {
  // ---- identity and outcome ----

  // True when the transaction applied. Mirrors TransactionResult.Successful().
  bool successful = 1;

  // Canonical Horizon-style transaction result code, e.g. "tx_SUCCESS",
  // "tx_BAD_SEQ", "tx_FAILED". Decoded from TransactionResultCode.
  string result_code = 2;

  // Per-operation result codes in operation order, e.g.
  // "op_INVOKE_HOST_FUNCTION_TRAPPED". Empty when the transaction failed
  // before operations were attempted.
  repeated string operation_result_codes = 3;

  // Source account of the transaction (G-address, or the fee account for a
  // fee bump).
  string source_account = 4;

  uint32 operation_count = 5;

  bool is_soroban = 6;
  bool is_fee_bump = 7;

  // ---- contract error ----

  // Set when a diagnostic event carries an ScError. Distinguishes a contract
  // declining to proceed from a host or client fault.
  bool contract_error_present = 10;

  // ScErrorType as a lowercase string: "contract", "wasm_vm", "budget",
  // "storage", "context", "object", "crypto", "events", "auth", "value".
  string contract_error_type = 11;

  // The contract's own error number — the "#4" in "#4 HealthFactorTooLow".
  // Only meaningful when contract_error_type is "contract".
  uint32 contract_error_code = 12;

  // ---- fees ----

  // Fee actually charged. In a contested ledger this is the clearing price and
  // is identical across every included transaction.
  int64 fee_charged_stroops = 20;

  // The bid: the maximum fee the submitter was willing to pay. A transaction
  // charged far below its bid is evidence the fee market did not clear at the
  // bid.
  int64 max_fee_stroops = 21;

  // Soroban resource fee declared in SorobanTransactionData. Zero for classic.
  int64 resource_fee_stroops = 22;

  // ---- size ----

  // Length in bytes of the marshaled TransactionEnvelope. Summed across a
  // ledger this is the transaction-size utilisation numerator.
  uint32 envelope_size_bytes = 30;

  // ---- Soroban resource footprint ----
  //
  // All five come from SorobanResources on the transaction. They are DECLARED
  // values, which is what the protocol charges against — not counts of entries
  // observed to change. This distinction is the whole reason this processor
  // exists: contract-state can tell you what changed, never what was reserved.

  uint32 instructions = 40;
  uint32 disk_read_bytes = 41;
  uint32 write_bytes = 42;

  // len(SorobanResources.Footprint.ReadOnly).
  uint32 read_only_entries = 43;

  // len(SorobanResources.Footprint.ReadWrite). Summed across a ledger this is
  // the ledger write-entry utilisation numerator, to be divided by
  // ConfigSettingContractLedgerCostV0.ledgerMaxWriteLedgerEntries.
  uint32 read_write_entries = 44;

  EventMeta meta = 50;
}

// EventMeta follows the registry's standard metadata shape.
message EventMeta {
  uint32 ledger_sequence = 1;
  int64 closed_at_unix = 2;
  string tx_hash = 3;
  // Position of the transaction within the ledger's applied transaction set.
  // Stellar shuffles apply order deterministically from the previous ledger
  // hash, so this is apply order, not fee order.
  uint32 transaction_index = 4;
}
