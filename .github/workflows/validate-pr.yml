name: Validate Processor Submission

on:
  pull_request:
    paths:
      - 'processors/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git diff

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }}

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Find changed processor directories
        id: changed-processors
        run: |
          # Get list of changed processor directories
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          processors=$(echo "$changed_files" | grep '^processors/' | cut -d'/' -f2 | sort -u | grep -v '^\.template$' || true)

          if [ -z "$processors" ]; then
            echo "No processor changes detected"
            echo "processors=" >> $GITHUB_OUTPUT
          else
            echo "Changed processors: $processors"
            echo "processors=$(echo $processors | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Validate processor submissions
        if: steps.changed-processors.outputs.processors != ''
        run: |
          nix develop --command bash -c '
            failed=""
            for processor in ${{ steps.changed-processors.outputs.processors }}; do
              echo "::group::Validating processor: $processor"
              bash scripts/validate-processor.sh "processors/$processor" || failed="$failed $processor"
              echo "::endgroup::"
            done
            if [ -n "$failed" ]; then
              echo "❌ Validation failed for:$failed"
              exit 1
            fi
          '

      - name: Build processors
        if: steps.changed-processors.outputs.processors != ''
        run: |
          nix develop --command bash -c '
            failed=""
            for processor in ${{ steps.changed-processors.outputs.processors }}; do
              echo "::group::Building processor: $processor"
              bash scripts/build-processor.sh "processors/$processor" || failed="$failed $processor"
              echo "::endgroup::"
            done
            if [ -n "$failed" ]; then
              echo "❌ Build failed for:$failed"
              exit 1
            fi
          '

      - name: Test processors
        if: steps.changed-processors.outputs.processors != ''
        run: |
          nix develop --command bash -c '
            failed=""
            for processor in ${{ steps.changed-processors.outputs.processors }}; do
              echo "::group::Testing processor: $processor"
              bash scripts/test-processor.sh "processors/$processor" || failed="$failed $processor"
              echo "::endgroup::"
            done
            if [ -n "$failed" ]; then
              echo "❌ Tests failed for:$failed"
              exit 1
            fi
          '

      - name: Generate processor list
        run: nix develop --command bash scripts/generate-list.sh

      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Processor checks failed (metadata validation, build, or tests). Expand the failing step in the workflow logs — each processor is logged in its own group, and the step ends with the list of processors that failed.'
            })
